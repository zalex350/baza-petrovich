# Тестовый стенд (тестовый стенд baza-petrovich). Самостоятельный файл, не дополнение к docker-compose.yml.
# В .env стенда: COMPOSE_FILE=docker-compose.staging.yml — тогда docker compose в папке
# проекта работает с этим файлом. Обновление — ./deploy.sh (docs/STAGING.md).
#
# Отличия от локального docker-compose.yml:
#   - код, vendor и собранный фронт — внутри образов (docker/staging/Dockerfile), без bind-mount;
#   - снаружи только .env (только чтение) и тома: БД и storage (фото, логи, сессии);
#   - MySQL наружу не открыт; nginx — только на 127.0.0.1, HTTPS и пароль — nginx сервера;
#   - node-контейнера нет: фронт собирается при сборке образа.
#
# Имя проекта baza_petrovich — те же имена контейнеров и тот же том БД baza_petrovich_dbdata,
# что при прежнем запуске: данные сохраняются.
name: baza_petrovich

services:

  php:
    build:
      context: .
      dockerfile: docker/staging/Dockerfile
      target: app
    image: baza_petrovich-app:latest
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/.env:ro
      - storage:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy

  # Воркер очереди (QUEUE_CONNECTION=database в .env): письма администраторам.
  # Тот же образ, что php; deploy.sh пересоздаёт контейнер новым образом и шлёт queue:restart.
  # --max-time: воркер раз в час перезапускается сам (restart: unless-stopped) — без утечек памяти.
  queue:
    image: baza_petrovich-app:latest
    pull_policy: never
    # От www-data, как php-fpm: лог и файлы обмена в storage — одного владельца
    user: www-data
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--max-time=3600"]
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./.env:/var/www/.env:ro
      - storage:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
      php:
        condition: service_started

  # Планировщик Laravel (routes/console.php): обмен с 1С — очистка архива файлов (ежедневно),
  # проверка и письма о сбоях (раз в 10 минут). schedule:work сам запускает schedule:run раз в минуту.
  scheduler:
    image: baza_petrovich-app:latest
    pull_policy: never
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./.env:/var/www/.env:ro
      - storage:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
      php:
        condition: service_started

  nginx:
    build:
      context: .
      dockerfile: docker/staging/Dockerfile
      target: web
    image: baza_petrovich-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:80"
    volumes:
      # Загруженные фото (public/storage → storage/app/public)
      - storage:/var/www/storage:ro
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE не задан в .env}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME не задан в .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD не задан в .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD не задан в .env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  dbdata:
  storage:
