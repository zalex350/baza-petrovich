; Фото товаров: до 20 файлов по 10 МБ за одну загрузку (AdminProductImageController::MAX_FILES);
; ZIP массовой загрузки фото — до 500 МБ (BulkImages::ZIP_MAX_KB). Остальные формы ограничивают размер
; своими правилами валидации. nginx: client_max_body_size 520M (docker/nginx, docker/staging и nginx сервера)
upload_max_filesize = 512M
post_max_size = 520M
max_file_uploads = 20
memory_limit = 256M

; Xdebug выключен; на один запуск — переменная окружения XDEBUG_MODE=debug|coverage
xdebug.mode = "off"

; Opcache и для CLI (artisan, тесты): тесты заново загружают конфиги и шаблоны в каждом
; тесте — без opcache это компиляция с медленного bind-mount Windows. Изменения кода
; подхватываются (проверка времени файлов включена).
opcache.enable_cli = 1
