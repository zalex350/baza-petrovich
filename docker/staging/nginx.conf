# nginx внутри стенда: статика из образа (public/, в т.ч. собранный фронт public/build),
# загруженные файлы — из тома storage (public/storage → storage/app/public), PHP — в php-fpm.
# HTTPS, basic auth и домен — на nginx сервера, он проксирует сюда (127.0.0.1:8090).
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 210M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Собранный Vite фронт: имена с хэшем — кэшируются надолго
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /storage/ {
        expires 7d;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
